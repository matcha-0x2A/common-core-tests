name: Common Core Tests Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-c-modules:
    name: 🧪 C Test Suites (Programming Fundamentals)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ 00-libft, 01-00-printf, 01-01-getnextline, 02-push-swap ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer les dépendances système & Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang make valgrind python3

      - name: ⚙️ Exécution de la suite de tests - ${{ matrix.module }}
        run: |
          echo "=== Lancement de la suite ${{ matrix.module }} ==="
          make -C 00-programming-fundamentals/${{ matrix.module }} all

      - name: 🛡️ Audit fuites mémoire (Valgrind) - ${{ matrix.module }}
        run: |
          echo "=== Audit Valgrind ${{ matrix.module }} ==="
          make -C 00-programming-fundamentals/${{ matrix.module }} valgrind

  test-python-modules:
    name: 🐍 Python Test Suites (Object-Oriented Programming)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installer Python & Flake8
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: 🔍 Linter Flake8
        run: |
          flake8 02-object-oriented-programming/ --max-line-length=120 --ignore=E402,W503 || true

      - name: 🧪 Exécution des tests Python
        run: |
          make python-tests
